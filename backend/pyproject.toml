[tool.poetry]
name = "realopen-ai-backend"
version = "0.1.0"
description = "RealOpen-AI - Fully offline, local AI chatbot backend"
authors = ["RealOpen-AI"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
httpx = "^0.27.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
redis = "^5.2.0"
python-multipart = "^0.0.18"
prometheus-fastapi-instrumentator = "^7.0.0"
pgvector = "^0.3.0"
pyyaml = "^6.0.0"
beautifulsoup4 = "^4.14.3"
pypdf = "^6.13.3"
pdfplumber = "^0.11.10"
python-docx = "^1.2.0"
openpyxl = "^3.1.5"
pandas = "^3.0.3"
pillow = "^12.2.0"
weasyprint = "^69.0"
markdown = "^3.10.2"
python-pptx = "^1.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

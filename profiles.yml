        description: "Qwen2.5 Coder 32B — a Code-Specific Qwen model, with significant improvements in code generation, code reasoning, and code fixing."
        size: "20 GB"

  64gb:
    description: "40+ GB RAM — largest models for enthusiast hardware"
    models:
      - id: qwen3.5:35b
        type: chat
        role: default
        description: "Qwen3.5 35B — a multimodal model that delivers exceptional utility and performance."
        size: "24 GB"

      - id: llava:34b
        type: vision
        role: default_vision
        description: "LLaVA 34B — a novel end-to-end trained large multimodal model that combines a vision encoder and Vicuna for general-purpose visual and language understanding."
        size: "20 GB"

      - id: nomic-embed-text:v1.5
        type: embedding
        role: default_embedding
        description: "Nomic Embed Text — a high-performing open embedding model with a large token context window."
        size: "274 MB"

      - id: qwen3-coder:30b
        type: code
        role: default_code
        description: "Qwen3 Coder 30B — a performant long context model for agentic and coding tasks."
        size: "19 GB"

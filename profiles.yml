# =============================================================================
# This is the SINGLE SOURCE OF TRUTH for model selection.
# Edit this file to add/remove/change models per hardware profile.
# No need to touch setup.sh, backend code, or frontend code.
#
# Profile naming convention:
#   cpu_small / cpu_medium                    — CPU-only (Windows/Linux, no GPU)
#   nvidia_small / nvidia_medium / nvidia_large / nvidia_xlarge — NVIDIA GPU (CUDA)
#   apple_small / apple_medium / apple_large / apple_xlarge    — Apple Silicon (Metal/MLX)
#
# Profile fields:
#   description: Internal description (used in logs / admin endpoints)
#   label:        Human-readable label shown in the UI (sidebar, welcome screen)
#   engine:       Inference engine — always "ollama" (Ollama supports both
#                 GGUF+Metal and MLX-format models on macOS)
#
# Model fields:
#   id:          Ollama model tag (used in `ollama pull <id>`)
#   type:        Model category — chat, vision, code, embedding
#   role:        How the model is used — default, default_vision, default_code, etc.
#                The backend resolves roles to model IDs automatically.
#                If the frontend sends model="default", backend looks up the
#                model with role="default" in the current hardware profile.
#   description: Human-readable label shown in the UI
#   size:        Approximate disk/RAM usage (informational)
# =============================================================================

profiles:
  # ── CPU-only profiles (Windows/Linux, no GPU) ──────────────────────────────

  cpu_small:
    description: "≤8 GB RAM — CPU-only, lightweight models for basic hardware"
    label: "CPU · Small"
    engine: ollama
    models:
      - id: qwen3:4b
        type: chat
        role: default
        description: "Qwen3 4B — compact yet capable dense model for general chat"
        size: "2.5 GB"

      - id: moondream:1.8b
        type: vision
        role: default_vision
        description: "Moondream 1.8B — tiny vision model for edge devices"
        size: "1.7 GB"

      - id: nomic-embed-text:v1.5
        type: embedding
        role: default_embedding
        description: "Nomic Embed Text — high-performing open embedding model"
        size: "274 MB"


# =============================================================================
# This is the SINGLE SOURCE OF TRUTH for model selection.
# Edit this file to add/remove/change models per hardware profile.
# No need to touch setup.sh, backend code, or frontend code.
#
# Voice (ASR + TTS) models are configured in the top-level `voice:` section
# near the end of this file — same single source of truth, same override
# mechanism (any hardware profile may override fields with its own
# `voice:` block).
#
# Profile naming convention:
#   cpu_small / cpu_medium                    — CPU-only (Windows/Linux, no GPU)
#   nvidia_small / nvidia_medium / nvidia_large / nvidia_xlarge — NVIDIA GPU (CUDA)
#   apple_small / apple_medium / apple_large / apple_xlarge    — Apple Silicon (Metal/MLX)
#
# Profile fields:
#   description: Internal description (used in logs / admin endpoints)
#   label:        Human-readable label shown in the UI (sidebar, welcome screen)
#   engine:       Inference engine — always "ollama" (Ollama supports both
#                 GGUF+Metal and MLX-format models on macOS)
#   voice:        Optional per-profile ASR/TTS overrides (merged over the
#                 top-level `voice:` defaults below). Any key may be
#                 overridden: provider, model, revision, language, voice, ...
#
# Model fields:
#   id:          Ollama model tag (used in `ollama pull <id>`)
#   type:        Model category — chat, vision, embedding
#   role:        How the model is used — default, default_coder, default_vision, etc.
#                The backend resolves roles to model IDs automatically.
#                If the frontend sends model="default", backend looks up the
#                model with role="default" in the current hardware profile.
#   description: Human-readable label shown in the UI
#   size:        Approximate disk/RAM usage (informational)
#
# Voice fields (top-level `voice:` below):
#   provider:    Implementation capability — qwen3-asr | pocket-tts
#                (the setup system picks the matching installer; changing
#                this value changes what gets installed, zero code edits)
#   model:       Provider-specific model identifier (HF repo id for qwen3-asr)
#   revision:    HF revision/branch for ASR snapshots (default: main)
#   language:    Pocket TTS language bundle (e.g. english_2026-04)
#   voice:       Pocket TTS default speaker name
#   type:        asr | tts
#   role:        default_asr | default_tts — resolved like Ollama model roles
#   description: Human-readable label shown in the UI
#   size:        Approximate disk usage (informational)
# =============================================================================

profiles:
  # ── CPU-only profiles (Windows/Linux, no GPU) ──────────────────────────────

  cpu_small:
    description: "≤8 GB RAM — CPU-only, lightweight models for basic hardware"
    label: "CPU · Small"
    engine: ollama
    models:
      - id: qwen3:4b
        type: chat
        role: default
        description: "Qwen3 4B — compact yet capable dense model for general chat"
        size: "2.5 GB"

      - id: qwen3:4b
        type: chat
        role: default_coder
        description: "Qwen3 4B — workspace coding agent"
        size: "2.5 GB"

      # Utility model used for background tasks (memory extraction, audit).
      # Falls back to the chat model if commented out — uncomment and point
      # to a smaller model (e.g. qwen3:1.7b) to reduce background load.
      - id: qwen3:4b
        type: chat
        role: default_utility
        description: "Qwen3 4B — reused for background memory extraction / audit"
        size: "2.5 GB"

      - id: qwen3.5:0.8b-q4_K_M
        type: chat
        role: role_voice
        description: "Qwen3.5 0.8B — low-latency voice assistant model"
        size: "~0.8 GB"

      - id: moondream:1.8b
        type: vision
        role: default_vision
        description: "Moondream 1.8B — tiny vision model for edge devices"
        size: "1.7 GB"

      - id: nomic-embed-text:v1.5

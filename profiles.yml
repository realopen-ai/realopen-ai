# ── Voice models (ASR + TTS) ──────────────────────────────────────────────
# Same single-source-of-truth file as the Ollama models above: ASR/TTS
# model selection lives ONLY here. These defaults apply to every hardware
# profile; any profile may override fields with its own `voice:` block:
#   profiles:
#     apple_large:
#       voice:
#         asr: { runtime: mlx }
voice:
  asr:
    provider: qwen3-asr
    model: Qwen/Qwen3-ASR-0.6B
    revision: main
    language: English
    type: asr
    role: default_asr
    description: "Qwen3-ASR 0.6B — streaming speech recognition (cross-platform)"
    size: "~1.4 GB"
  tts:
    provider: pocket-tts
    model: pocket-tts
    language: english_2026-04
    voice: mary
    type: tts
    role: default_tts
    description: "Pocket TTS — streaming neural speech synthesis"
    size: "~600 MB"

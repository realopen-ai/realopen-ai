name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · test, build, format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend · lint, test, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      HARDWARE_PROFILE: cpu_small
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.1.4
      - name: Cache Poetry and virtual environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pypoetry
            backend/.venv
          key: poetry-${{ runner.os }}-py312-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py312-
      - name: Install PDF runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libglib2.0-0 libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz-subset0 fontconfig fonts-dejavu-core
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root --with dev
      - name: Run Ruff
        run: poetry run ruff check app tests
      - name: Validate Alembic migration graph
        run: |
          test "$(poetry run alembic heads | grep -c '(head)')" -eq 1
          poetry run alembic history >/dev/null
      - name: Run backend tests
        run: poetry run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  validation:
    name: Configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate whitespace
        run: git diff --check HEAD^ HEAD
        if: github.event_name == 'push'
      - name: Validate whitespace in pull request
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
        if: github.event_name == 'pull_request'
      - name: Validate hardware profiles
        run: make validate-profiles
      - name: Validate module profiles
        run: make validate-modules
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet

  docker-build:
    name: Docker · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: sandbox
            context: sandbox
            file: sandbox/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
          - name: nginx
            context: .
            file: nginx/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

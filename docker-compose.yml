# =============================================================================
# Ollama runs natively on the host (not in this file)
# =============================================================================

services:
  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: realopen-postgres
    environment:
      POSTGRES_DB: realopen
      POSTGRES_USER: realopen
      POSTGRES_PASSWORD: realopen
    volumes:
      - ./data/postgres/docker:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realopen"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - realopen-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis
  redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: realopen-redis
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - ./data/valkey/docker:/data
    mem_limit: 64m
    cpus: 0.25
    networks:
      - realopen-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Bundled search services: the host runtime reconciles saved provider choices.
  # Profiles prevent Compose startup from running unselected services.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: realopen-searxng
    profiles: [search]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./monitoring/searxng-settings.yml:/etc/searxng/settings.yml:ro
      - ./monitoring/searxng-limiter.toml:/etc/searxng/limiter.toml:ro
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    networks:
      - realopen-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Degoog (also available through the manual "degoog" profile)
  # Open localhost:4444 and install web engines using the setup wizard.
  degoog:
    image: ghcr.io/degoog-org/degoog:latest
    container_name: realopen-degoog
    profiles: [search, degoog]
    volumes:
      - ./data/degoog:/app/data
    ports:
      - "127.0.0.1:4444:4444"
    restart: "no"
    networks:
      - realopen-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realopen-backend
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://realopen:realopen@postgres:5432/realopen}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
      - DEGOOG_BASE_URL=${DEGOOG_BASE_URL:-http://degoog:4444}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - VOICE_RUNTIME_URL=${VOICE_RUNTIME_URL:-http://host.docker.internal:8766}
      - ENABLED_MODULES=${ENABLED_MODULES:-assistant}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/uploads
      - ./profiles.yml:/app/profiles.yml:ro
      - ./modules.yml:/app/modules.yml:ro
      - ./data/state:/app/state
      - ./data:/app/data
      - ./data/cache/apt:/var/cache/apt
      - ./data/cache/apt-lists:/var/lib/apt/lists
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - realopen-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx (Production: serves frontend + proxies to backend)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: realopen-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./data/cache/nginx:/var/cache/nginx
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    networks:
      - realopen-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Ngrok (Optional Remote Access)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: realopen-ngrok
    profiles:
      - tunnel
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command: http nginx:80
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - realopen-net

networks:
  realopen-net:
    driver: bridge

# Victoria Metrics scrape configuration (Prometheus-compatible)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI Backend metrics
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  # Node Exporter (host metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Victoria Metrics self-monitoring
  - job_name: "victoria-metrics"
    static_configs:
      - targets: ["victoria-metrics:8428"]
